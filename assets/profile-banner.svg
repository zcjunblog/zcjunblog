<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Zicheng Zhao — Building useful things for the web</title>
  <desc id="desc">A dark blue gradient banner with a geometric grid and a small code symbol.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1222"/><stop offset=".56" stop-color="#10283a"/><stop offset="1" stop-color="#122d39"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#5eead4"/></linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#8ddedb" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="1200" height="280" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="18" fill="url(#grid)"/>
  <circle cx="1015" cy="140" r="97" fill="none" stroke="#5eead4" stroke-opacity=".18"/>
  <circle cx="1015" cy="140" r="72" fill="none" stroke="#38bdf8" stroke-opacity=".24"/>
  <text x="1015" y="155" fill="#78e6de" font-family="monospace" font-size="46" text-anchor="middle" opacity=".8">&lt;/&gt;</text>
  <rect x="64" y="54" width="50" height="4" rx="2" fill="url(#accent)"/>
  <text x="64" y="119" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-weight="700" font-size="47" letter-spacing="1">ZICHENG ZHAO</text>
  <text x="65" y="159" fill="#98e4e1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="20" letter-spacing="2">BUILDING USEFUL THINGS FOR THE WEB</text>
  <text x="65" y="220" fill="#a7b9c9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="16" letter-spacing="1">FRONTEND  /  WEB APPS  /  OPEN SOURCE</text>
</svg>
